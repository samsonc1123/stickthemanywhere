version: "3.9"

# ─── Sovereign Mainframe Stack ────────────────────────────────────────────────
# Portable intelligence stack designed for Synology NAS deployment.
# All services communicate over the internal 'mainframe' network.
# Volumes persist data across container restarts.
#
# Start:   docker compose up -d
# Stop:    docker compose down
# Rebuild: docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL — Primary Data Vault ─────────────────────────────────────────
  db:
    image: postgres:latest
    container_name: mainframe_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-mainframe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-sovereign}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mainframe
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mainframe}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API — Node 20 Alpine — Core Logic Server ─────────────────────────────────
  api:
    image: node:20-alpine
    container_name: mainframe_api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm install && npm run start"
    environment:
      NODE_ENV:     production
      DATABASE_URL: postgres://${POSTGRES_USER:-mainframe}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-sovereign}
      PORT:         4000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mainframe

  # ── Agents — Ollama — Local LLM / AI Engine ──────────────────────────────────
  agents:
    image: ollama/ollama
    container_name: mainframe_agents
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - mainframe
    # To pull a model after first start:
    #   docker exec mainframe_agents ollama pull llama3
    #   docker exec mainframe_agents ollama pull mistral

  # ── Simulation — Monte Carlo Engine ──────────────────────────────────────────
  # Runs probabilistic simulations on structured datasets.
  # Exposes a REST API on port 5050.
  # POST /simulate  → body: { schema, iterations, variables }
  # GET  /results/:id → retrieve a completed simulation run
  #
  # To run a quick smoke test after start:
  #   curl http://localhost:5050/health
  simulation:
    image: node:20-alpine
    container_name: mainframe_simulation
    restart: unless-stopped
    working_dir: /app/simulation
    volumes:
      - ./toolbox/tools/data-modeling:/app/simulation/tools
      - simulation_results:/app/simulation/results
    command: >
      sh -c "
        npm init -y &&
        npm install express &&
        node -e \"
          const express = require('express');
          const crypto  = require('crypto');
          const fs      = require('fs');
          const app     = express();
          app.use(express.json());

          app.get('/health', (_, res) => res.json({ status: 'ok', service: 'monte-carlo' }));

          /* Monte Carlo simulation endpoint */
          app.post('/simulate', (req, res) => {
            const { iterations = 10000, variables = {}, label = 'run' } = req.body;
            const id      = crypto.randomUUID();
            const results = [];

            for (let i = 0; i < iterations; i++) {
              const trial = {};
              for (const [key, cfg] of Object.entries(variables)) {
                const { distribution = 'uniform', min = 0, max = 1, mean, stddev } = cfg;
                if (distribution === 'normal' && mean !== undefined && stddev !== undefined) {
                  /* Box-Muller transform */
                  const u1 = Math.random(), u2 = Math.random();
                  trial[key] = mean + stddev * Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
                } else {
                  trial[key] = min + Math.random() * (max - min);
                }
              }
              results.push(trial);
            }

            /* Summarise each variable */
            const summary = {};
            for (const key of Object.keys(variables)) {
              const vals = results.map(r => r[key]).sort((a,b) => a-b);
              const n    = vals.length;
              const mean = vals.reduce((s,v) => s+v, 0) / n;
              const variance = vals.reduce((s,v) => s + (v-mean)**2, 0) / n;
              summary[key] = {
                mean: mean.toFixed(4),
                stddev: Math.sqrt(variance).toFixed(4),
                p10: vals[Math.floor(n*0.10)].toFixed(4),
                p50: vals[Math.floor(n*0.50)].toFixed(4),
                p90: vals[Math.floor(n*0.90)].toFixed(4),
                min: vals[0].toFixed(4),
                max: vals[n-1].toFixed(4),
              };
            }

            const run = { id, label, iterations, summary, completedAt: new Date().toISOString() };
            fs.mkdirSync('/app/simulation/results', { recursive: true });
            fs.writeFileSync('/app/simulation/results/' + id + '.json', JSON.stringify(run, null, 2));
            res.json(run);
          });

          /* Retrieve a saved simulation result */
          app.get('/results/:id', (req, res) => {
            const p = '/app/simulation/results/' + req.params.id + '.json';
            if (!fs.existsSync(p)) return res.status(404).json({ error: 'Not found' });
            res.json(JSON.parse(fs.readFileSync(p, 'utf8')));
          });

          app.listen(5050, () => console.log('Monte Carlo engine running on :5050'));
        \"
      "
    environment:
      NODE_ENV: production
    ports:
      - "5050:5050"
    networks:
      - mainframe

  # ── Tileserver — Offline Map Layer (OpenMapTiles / MapLibre) ─────────────────
  # Self-hosted vector + raster tile server for the Omni-View dashboard.
  # Runs entirely offline — no external map API keys needed on the Synology.
  #
  # Setup:
  #   1. Download a region .mbtiles from https://data.maptiler.com/downloads/
  #      or use openmaptiles/openmaptiles-tools to generate one.
  #   2. Place the file at: ./tileserver-data/map.mbtiles
  #   3. Place a MapLibre style JSON at: ./tileserver-data/config.json
  #      (see: https://tileserver-gl.readthedocs.io for config format)
  #   4. Run: docker compose up -d tileserver
  #
  # Endpoints:
  #   http://localhost:8080              → TileServer GL GUI
  #   http://localhost:8080/styles       → Available styles
  #   http://localhost:8080/data         → Available tile datasets
  #   http://localhost:8080/health       → Health check
  #
  # MapLibre GL JS client connection:
  #   style: 'http://localhost:8080/styles/bright/style.json'
  tileserver:
    image: maptiler/tileserver-gl:latest
    container_name: mainframe_tileserver
    restart: unless-stopped
    volumes:
      - ./tileserver-data:/data
    command: ["--config", "/data/config.json", "--port", "8080"]
    ports:
      - "8080:8080"
    networks:
      - mainframe
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── UI — Next.js — Intelligence Dashboard ────────────────────────────────────
  ui:
    image: node:20-alpine
    container_name: mainframe_ui
    restart: unless-stopped
    working_dir: /app/ui
    volumes:
      - ./ui:/app/ui
      - /app/ui/node_modules
    command: sh -c "npm install && npm run build && npm run start"
    environment:
      NODE_ENV:           production
      NEXT_PUBLIC_API_URL: http://api:4000
      NEXT_PUBLIC_OLLAMA_URL: http://agents:11434
    ports:
      - "3000:3000"
    depends_on:
      - api
      - agents
    networks:
      - mainframe

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  db_data:
    driver: local
  ollama_data:
    driver: local
  simulation_results:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  mainframe:
    driver: bridge
